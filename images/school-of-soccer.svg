<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Mockup of the School of Soccer website">
  <defs>
    <clipPath id="clip"><rect width="560" height="360" rx="16"/></clipPath>
    <clipPath id="strip"><rect x="0" y="336" width="560" height="24"/></clipPath>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset=".45" stop-color="#15161D"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5A2E"/>
      <stop offset="1" stop-color="#0E2E17"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0B0F" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#0B0B0F" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0B0B0F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cond { font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif; font-weight: 800; }
    .beam { transform-box: fill-box; transform-origin: 50% 0; animation: sweep 6s ease-in-out infinite alternate; }
    .bm2 { animation-delay: -2s; } .bm3 { animation-delay: -4s; }
    @keyframes sweep { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    .flash { animation: flash 2.6s steps(1) infinite; }
    .f2 { animation-delay: -.9s; } .f3 { animation-delay: -1.7s; }
    @keyframes flash { 0% { opacity: .9; } 8% { opacity: .15; } }
    .ball { animation: roll 4s cubic-bezier(.45,0,.55,1) infinite alternate; }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-150px); } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite alternate; }
    @keyframes spin { to { transform: rotate(-420deg); } }
    .marq { animation: marq 10s linear infinite; }
    @keyframes marq { to { transform: translateX(-300px); } }
    .join { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .dot { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .2; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="560" height="360" fill="url(#night)"/>

    <!-- stadium crowd + beams -->
    <g fill="#fff">
      <circle class="flash" cx="40" cy="96" r="1"/><circle class="flash f2" cx="90" cy="84" r="1"/><circle class="flash f3" cx="150" cy="100" r="1"/>
      <circle class="flash" cx="210" cy="78" r="1"/><circle class="flash f2" cx="270" cy="92" r="1"/><circle class="flash f3" cx="330" cy="80" r="1"/>
      <circle class="flash" cx="390" cy="98" r="1"/><circle class="flash f2" cx="450" cy="86" r="1"/><circle class="flash f3" cx="510" cy="96" r="1"/>
      <circle class="flash f3" cx="120" cy="120" r="1"/><circle class="flash" cx="300" cy="118" r="1"/><circle class="flash f2" cx="480" cy="122" r="1"/>
    </g>
    <g opacity=".5" fill="#2A2C38">
      <rect x="0" y="130" width="560" height="60"/>
    </g>
    <path class="beam" d="M150 0 L196 0 L250 230 L90 230 Z" fill="url(#beam)"/>
    <path class="beam bm2" d="M330 0 L370 0 L460 230 L300 230 Z" fill="url(#beam)"/>
    <path class="beam bm3" d="M470 0 L505 0 L560 200 L430 200 Z" fill="url(#beam)"/>

    <!-- pitch -->
    <path d="M0 196 L560 186 L560 336 L0 336 Z" fill="url(#grass)"/>
    <rect x="0" y="190" width="560" height="6" fill="#B8323A" opacity=".8"/>
    <g stroke="#fff" stroke-opacity=".35" stroke-width="1.5" fill="none">
      <path d="M0 262 Q 280 246 560 258"/>
      <ellipse cx="300" cy="258" rx="58" ry="16"/>
      <path d="M440 216 L520 212 L540 300 L430 306 Z"/>
    </g>
    <g stroke="#fff" stroke-opacity=".85" stroke-width="1.6" fill="none">
      <path d="M470 236 v-26 h44 v26"/>
    </g>
    <g fill="#E8E8EE"><circle cx="160" cy="232" r="2.2"/><circle cx="210" cy="246" r="2.2"/><circle cx="380" cy="240" r="2.2"/></g>
    <g fill="#E85D2C"><circle cx="186" cy="226" r="2.2"/><circle cx="256" cy="238" r="2.2"/><circle cx="350" cy="230" r="2.2"/></g>

    <rect x="0" y="40" width="560" height="296" fill="url(#fade)"/>

    <!-- nav -->
    <rect width="560" height="40" fill="#0B0B0F" opacity=".75"/>
    <circle cx="24" cy="20" r="8" fill="#fff"/>
    <path d="M24 14l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z" fill="#0B0B0F"/>
    <text x="38" y="24" class="cond" font-size="11" fill="#fff" letter-spacing=".4">SCHOOL <tspan fill="#F5B700">OF</tspan> SOCCER</text>
    <g font-size="7.5" fill="#C9CAD3">
      <text x="196" y="24">Home</text><text x="226" y="24">About</text><text x="258" y="24">Programs</text>
      <text x="300" y="24">Stars</text><text x="328" y="24">Achievements</text><text x="386" y="24">Gallery</text><text x="420" y="24">Contact</text>
    </g>
    <rect x="456" y="13" width="18" height="14" rx="7" fill="#F5B700"/>
    <text x="465" y="23" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0B0B0F">EN</text>
    <g class="join">
      <rect x="484" y="10" width="62" height="20" rx="10" fill="#F5B700"/>
      <text x="515" y="23.5" text-anchor="middle" font-weight="700" font-size="8" fill="#0B0B0F">Join Now</text>
    </g>

    <!-- hero copy -->
    <rect x="28" y="70" width="150" height="16" rx="8" fill="#0B0B0F" stroke="#F5B700" stroke-opacity=".6"/>
    <circle class="dot" cx="38" cy="78" r="2.2" fill="#F5B700"/>
    <text x="45" y="81" font-size="6.6" font-weight="700" letter-spacing=".8" fill="#F5B700">FOOTBALL ACADEMY IN SAMASTIPUR</text>
    <text x="28" y="128" class="cond" font-size="36" fill="#fff">LEARN. PLAY.</text>
    <text x="28" y="166" class="cond" font-size="36" fill="#fff"><tspan fill="#F5B700">GROW</tspan> WITH FOOTBALL.</text>
    <rect x="28" y="180" width="200" height="5" rx="2.5" fill="#fff" opacity=".45"/>
    <rect x="28" y="190" width="150" height="5" rx="2.5" fill="#fff" opacity=".45"/>

    <!-- ball -->
    <g class="ball">
      <ellipse cx="420" cy="292" rx="12" ry="3" fill="#000" opacity=".4"/>
      <g class="spin">
        <circle cx="420" cy="280" r="11" fill="#fff"/>
        <path d="M420 274.5l4.2 3-1.6 5h-5.2l-1.6-5z" fill="#111"/>
      </g>
    </g>

    <!-- admissions bar -->
    <rect x="28" y="290" width="504" height="38" rx="10" fill="#121218" stroke="#2A2B35"/>
    <text x="42" y="305" class="cond" font-size="12" fill="#F5B700">ADMISSIONS OPEN</text>
    <text x="42" y="319" font-size="7" fill="#C9CAD3">6:00 AM – 9:00 PM · all days · Stadium Road, Samastipur</text>
    <rect x="322" y="299" width="62" height="20" rx="10" fill="#F5B700"/>
    <text x="353" y="312.5" text-anchor="middle" font-weight="700" font-size="7.5" fill="#0B0B0F">Join Now →</text>
    <rect x="390" y="299" width="56" height="20" rx="10" fill="none" stroke="#fff" stroke-opacity=".5"/>
    <text x="418" y="312.5" text-anchor="middle" font-weight="700" font-size="7.5" fill="#fff">Call Us</text>
    <rect x="452" y="299" width="72" height="20" rx="10" fill="#25D366"/>
    <text x="488" y="312.5" text-anchor="middle" font-weight="700" font-size="7.5" fill="#0B0B0F">WhatsApp Us</text>

    <!-- marquee -->
    <rect x="0" y="336" width="560" height="24" fill="#0B0B0F"/>
    <rect x="0" y="336" width="560" height="1" fill="#24242C"/>
    <g clip-path="url(#strip)">
      <g class="marq" font-weight="800" font-size="8" letter-spacing="1.4" fill="#E9E9EE">
        <text x="10" y="351">FOOTBALL COACHING  <tspan fill="#F5B700">◆</tspan>  FITNESS TRAINING  <tspan fill="#F5B700">◆</tspan>  KIDS &amp; YOUTH BATCHES  <tspan fill="#F5B700">◆</tspan>  SAMASTIPUR  <tspan fill="#F5B700">◆</tspan>  FOOTBALL COACHING  <tspan fill="#F5B700">◆</tspan>  FITNESS TRAINING  <tspan fill="#F5B700">◆</tspan>  KIDS &amp; YOUTH BATCHES</text>
      </g>
    </g>
  </g>
</svg>
