<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 360" role="img" aria-label="Sundari Jewellers website on a phone">
  <defs>
    <clipPath id="screen"><rect x="10" y="10" width="160" height="340" rx="24"/></clipPath>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9C46A"/><stop offset="1" stop-color="#B8862F"/></linearGradient>
  </defs>
  <style>
    .scroll { animation: scroll 9s ease-in-out infinite; }
    @keyframes scroll { 0%, 15% { transform: translateY(0); } 45%, 60% { transform: translateY(-150px); } 90%, 100% { transform: translateY(0); } }
    .shine { animation: shine 3s ease-in-out infinite; }
    @keyframes shine { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
  </style>
  <rect width="180" height="360" rx="32" fill="#0B0B0D"/>
  <rect x="4" y="4" width="172" height="352" rx="29" fill="none" stroke="#2A2A30" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="10" y="10" width="160" height="340" fill="#FBF6EE"/>
    <g class="scroll">
      <rect x="10" y="10" width="160" height="40" fill="#FBF6EE"/>
      <text x="26" y="42" font-family="Georgia, serif" font-size="12" fill="#3A2416">Sundari</text>
      <path d="M146 33h12M146 38h12M146 43h8" stroke="#3A2416" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="20" y="56" width="140" height="150" rx="12" fill="#2A1B12"/>
      <circle cx="90" cy="118" r="34" fill="none" stroke="url(#gold)" stroke-width="7"/>
      <circle cx="90" cy="84" r="9" fill="#F4F1EA"/>
      <circle class="shine" cx="94" cy="80" r="3" fill="#fff"/>
      <text x="90" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#F4E7D0">Crafted forever</text>
      <rect x="62" y="190" width="56" height="8" rx="4" fill="#C9A04F" opacity=".7"/>
      <text x="20" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" fill="#A0702F">COLLECTIONS</text>
      <g>
        <rect x="20" y="242" width="66" height="84" rx="10" fill="#F1E6D4"/>
        <path d="M36 270 q17 30 34 0" fill="none" stroke="#C9A04F" stroke-width="3"/>
        <rect x="94" y="242" width="66" height="84" rx="10" fill="#F1E6D4"/>
        <circle cx="127" cy="282" r="14" fill="none" stroke="#B8862F" stroke-width="3"/>
        <rect x="20" y="334" width="66" height="84" rx="10" fill="#F1E6D4"/>
        <circle cx="53" cy="372" r="10" fill="none" stroke="#C9A04F" stroke-width="3"/>
        <circle cx="53" cy="372" r="3" fill="#C9A04F"/>
        <rect x="94" y="334" width="66" height="84" rx="10" fill="#F1E6D4"/>
        <path d="M110 362 q17 30 34 0" fill="none" stroke="#A57B32" stroke-width="3" stroke-dasharray="2 3"/>
        <rect x="20" y="430" width="140" height="34" rx="17" fill="#25D366"/>
        <text x="90" y="451" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="10" fill="#fff">Enquire in one tap</text>
      </g>
    </g>
  </g>
  <rect x="64" y="16" width="52" height="14" rx="7" fill="#0B0B0D"/>
</svg>
