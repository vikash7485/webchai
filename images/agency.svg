<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of WebChai code being delivered as a site under an agency's brand">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1D0C"/>
      <stop offset="1" stop-color="#110D07"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".9" r=".8">
      <stop offset="0" stop-color="#F5A524" stop-opacity=".3"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="480" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .float { animation: float 5s ease-in-out infinite; }
    .float2 { animation: float 6s ease-in-out -2.5s infinite; }
    @keyframes float { 50% { transform: translateY(-7px); } }
    .flow { stroke-dasharray: 6 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    .packet { animation: packet 2.4s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes packet { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(92px,0); opacity: 0; } }
    .logo { animation: logo 8s steps(1) infinite; }
    @keyframes logo { 0% { fill: #6D5DFC; } 25% { fill: #10B981; } 50% { fill: #EF4444; } 75% { fill: #0EA5E9; } }
    .btn { animation: logo 8s steps(1) infinite; }
    .n { opacity: 0; animation: name 8s steps(1) infinite; }
    .n1 { animation-delay: 0s; } .n2 { animation-delay: -6s; } .n3 { animation-delay: -4s; } .n4 { animation-delay: -2s; }
    @keyframes name { 0% { opacity: 1; } 25% { opacity: 0; } }
    .line { transform-box: fill-box; transform-origin: 0 50%; animation: type 2.4s ease-in-out infinite; }
    .l2 { animation-delay: .2s; } .l3 { animation-delay: .4s; } .l4 { animation-delay: .6s; }
    @keyframes type { 0% { transform: scaleX(0); } 40%, 100% { transform: scaleX(1); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="480" height="300" fill="url(#bg)"/>
    <rect width="480" height="300" fill="url(#glow)"/>

    <!-- code window (WebChai, behind the scenes) -->
    <g class="float">
      <rect x="28" y="70" width="150" height="160" rx="14" fill="#0D1016" stroke="#2C3342"/>
      <circle cx="44" cy="86" r="3.5" fill="#FF5F57"/><circle cx="55" cy="86" r="3.5" fill="#FEBC2E"/><circle cx="66" cy="86" r="3.5" fill="#28C840"/>
      <text x="44" y="118" font-family="Consolas, Menlo, monospace" font-size="12" fill="#F5A524">&lt;/&gt;</text>
      <rect class="line" x="44" y="132" width="96" height="6" rx="3" fill="#6D7891"/>
      <rect class="line l2" x="56" y="146" width="80" height="6" rx="3" fill="#F5A524" opacity=".8"/>
      <rect class="line l3" x="56" y="160" width="64" height="6" rx="3" fill="#34D399" opacity=".8"/>
      <rect class="line l4" x="44" y="174" width="88" height="6" rx="3" fill="#6D7891"/>
      <text x="44" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9AA1AE">Built quietly</text>
    </g>

    <!-- hand-off -->
    <path class="flow" d="M186 150 H282" stroke="#F5A524" stroke-width="2" stroke-linecap="round" fill="none"/>
    <g class="packet"><rect x="184" y="142" width="16" height="16" rx="4" fill="#F5A524"/></g>

    <!-- branded site -->
    <g class="float2">
      <rect x="300" y="52" width="160" height="196" rx="14" fill="#fff" opacity=".18" transform="translate(-14 10)"/>
      <rect x="292" y="44" width="160" height="196" rx="14" fill="#FFFFFF"/>
      <rect x="292" y="44" width="160" height="24" rx="14" fill="#EEF0F4"/>
      <rect x="292" y="56" width="160" height="12" fill="#EEF0F4"/>
      <circle class="logo" cx="312" cy="88" r="8"/>
      <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="11" fill="#0E1015">
        <text class="n n1" x="326" y="92">Your Agency</text>
        <text class="n n2" x="326" y="92">Northwind</text>
        <text class="n n3" x="326" y="92">Redline</text>
        <text class="n n4" x="326" y="92">Bluepeak</text>
      </g>
      <rect x="308" y="114" width="124" height="11" rx="4" fill="#0E1015" opacity=".85"/>
      <rect x="308" y="131" width="90" height="11" rx="4" fill="#0E1015" opacity=".85"/>
      <rect x="308" y="152" width="112" height="5" rx="2.5" fill="#0E1015" opacity=".2"/>
      <rect x="308" y="162" width="84" height="5" rx="2.5" fill="#0E1015" opacity=".2"/>
      <rect class="btn" x="308" y="178" width="62" height="20" rx="10"/>
      <rect x="308" y="214" width="128" height="1" fill="#0E1015" opacity=".12"/>
      <text x="308" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8" fill="#6B7280">Your brand. Your client.</text>
    </g>

    <!-- badge -->
    <g class="float">
      <rect x="196" y="236" width="128" height="30" rx="15" fill="#123327"/>
      <path d="M212 251l4 4 8-8" stroke="#34D399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="232" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="10.5" fill="#34D399">100% white-label</text>
    </g>
  </g>
</svg>
